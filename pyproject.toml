[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "novetly-score"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "yukka-lab" }
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "boto3>=1.35",
    # botocore is imported directly (Config, exceptions), not only via boto3.
    "botocore>=1.35",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/yukka-lab/novetly-score"
Repository = "https://github.com/yukka-lab/novetly-score"

# deptry cannot infer this module name from the distribution name.
[tool.deptry.package_module_name_map]
python-dotenv = "dotenv"

[tool.hatch.build.targets.wheel]
packages = ["src/novetly_score"]

[dependency-groups]
test = [
    "moto[s3,server]>=5.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.0.0",
]
lint = [
    "ruff>=0.11.0",
]
# Type stubs only: boto3/botocore ship no py.typed marker, and data/s3.py annotates
# the client it returns as mypy_boto3_s3.client.S3Client under TYPE_CHECKING.
dev = [
    "boto3-stubs[s3]>=1.35",
    "botocore-stubs>=1.35",
]
