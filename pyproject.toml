[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "novetly-score"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "yukka-lab" }
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "boto3>=1.35",
    # botocore is imported directly (Config, exceptions), not only via boto3.
    "botocore>=1.35",
    # The engine the data layer reads parquet with: range reads straight off the store,
    # so a filtered query costs a fraction of the object rather than a download.
    "duckdb>=2.0.0",
    # polars is imported directly (frames are what the layer returns), not only via yukka.
    # The duckdb -> polars handoff goes through the Arrow C stream, so no pyarrow is needed.
    "openai>=3.46.0",
    "polars>=2.1",
    "python-dotenv>=1.0",
    # The universes the data layer is addressed by: Index.STOXX600 and Asset.
    "yukka>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yukka-lab/novetly-score"
Repository = "https://github.com/yukka-lab/novetly-score"

# deptry cannot infer this module name from the distribution name.
[tool.deptry.package_module_name_map]
python-dotenv = "dotenv"

# yukka is imported for real by panel.py (the STOXX 600 universe) and data/prices.py (the EUR
# price and total-return snapshot, which is a YUKKA product). data/snippets.py still does not: it
# reads a ``yukka_id`` off whatever it is handed rather than importing the classes, which is what
# lets the snippets be addressed by a plain id as readily as by a universe.

[tool.hatch.build.targets.wheel]
packages = ["src/novetly_score"]

[dependency-groups]
test = [
    # 5.0.13 is where ThreadedMotoServer.get_host_and_port lands, which the fixture store in
    # tests/test_snippets.py uses to find the port it asked the OS to pick. Below it the whole
    # suite errors at fixture setup, which the lowest-direct CI resolve is there to catch.
    "moto[s3,server]>=5.0.13",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.0.0",
]
lint = [
    "ruff>=0.11.0",
]
# Type stubs only: boto3/botocore ship no py.typed marker, and data/s3.py annotates
# the client it returns as mypy_boto3_s3.client.S3Client under TYPE_CHECKING.
dev = [
    "boto3-stubs[s3]>=1.35",
    "botocore-stubs>=1.35",
]
# What the marimo notebooks under docs/notebooks import and src never does: the notebook
# runtime, the stats/plot layer the IC baseline reports through, and their own numerics.
# Declared as a group rather than a project dependency so an install of this package does not
# pull a notebook server; deptry's DEP004 is ignored for the notebook folder for the same reason
# (see .rhiza/make.d/marimo.mk).
notebook = [
    "basanos>=0.7.3",
    "jquantstats>=0.13",
    "marimo>=0.19",
    "numpy>=2",
    "plotly>=6",
]

# basanos 0.7.3 imports cvx.linalg.ewm_cov, a module cvx-linalg dropped in 0.9.0, but declares
# only cvx-linalg>=0.6.1. An unconstrained resolve therefore installs 1.x and `import
# basanos.math` fails outright with ModuleNotFoundError. Pinned here as a constraint rather than
# as a dependency because nothing in this repo imports cvx-linalg -- it is basanos's own
# requirement, corrected. Drop this once basanos tracks the module's new home.
[tool.uv]
constraint-dependencies = ["cvx-linalg<0.9"]
